<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camping Foglalás</title>
    <script src="script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#">Camping</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#bemutatkozas">Bemutatkozás</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#foglalasok">Foglalások</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#ujfoglalas">Új foglalás</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
>
<section id="bemutatkozas" class="hero">
    <div class="container text-center">
        <h1>Természetközeli Camping</h1>
        <p>
            Pihenj a természetben sátorhelyen, lakókocsival vagy kényelmes mobilházban!
        </p>
        <a href="#ujfoglalas" class="btn btn-success">Foglalás készítése</a>
    </div>
</section>
<section id="foglalasok" class="container my-5">
    <h2 class="text-center mb-4">Foglalások</h2>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Keresés név alapján</label>
            <input type="text" id="kereses" class="form-control"
                   placeholder="Vendég neve...">
        </div>

        <div class="col-md-6">
            <label class="form-label">Szűrés hely típusa szerint</label>
            <select id="tipusSzures" class="form-select">
                <option value="">Minden típus</option>
                <option value="Sátorhely">Sátorhely</option>
                <option value="Lakókocsihely">Lakókocsihely</option>
                <option value="Mobilház">Mobilház</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <button class="btn btn-success" onclick="tablaNezet()">
            Táblázat
        </button>

        <button class="btn btn-secondary" onclick="kartyaNezet()">
            Kártyák
        </button>
    </div>

    <div id="foglalasLista"></div>
</section>
